<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Driving fatigue safety threshold</title>
  <desc id="desc">Four-hour driving threshold, attention decline, and brain monitoring.</desc>
  <defs>
