    <linearGradient id="risk" x2="1"><stop stop-color="#52b7ad"/><stop offset=".57" stop-color="#52b7ad"/><stop offset=".58" stop-color="#f0b463"/><stop offset="1" stop-color="#d96b5f"/></linearGradient>
  </defs>
  <rect width="900" height="500" rx="22" fill="url(#bg)"/>
  <g opacity=".14" stroke="#c8dce6"><path d="M0 100H900M0 200H900M0 300H900M0 400H900"/><path d="M150 0V500M300 0V500M450 0V500M600 0V500M750 0V500"/></g>
  <text x="62" y="76" fill="#f5f0e8" font-family="Arial,sans-serif" font-size="24" letter-spacing="4">DRIVING FATIGUE</text>
  <text x="62" y="116" fill="#9bb6c7" font-family="Arial,sans-serif" font-size="17">behavioral performance and fNIRS monitoring</text>
