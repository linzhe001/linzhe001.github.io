  <rect width="900" height="500" rx="22" fill="url(#paper)"/>
  <g opacity=".22" stroke="#6e8a99"><path d="M0 100H900M0 200H900M0 300H900M0 400H900"/><path d="M150 0V500M300 0V500M450 0V500M600 0V500M750 0V500"/></g>
  <text x="55" y="72" fill="#173c57" font-family="Arial,sans-serif" font-size="24" letter-spacing="4">GENETIC TESTING</text>
  <text x="55" y="108" fill="#607d8a" font-family="Arial,sans-serif" font-size="17">quality, access, oversight, and public trust</text>
