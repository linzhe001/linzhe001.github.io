<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Regulation of genetic testing</title>
  <desc id="desc">DNA linked to regulatory quality checkpoints and a shield.</desc>
