  <g transform="translate(665 113)"><path d="M78 0c34 25 70 30 92 32v105c0 94-62 147-92 161-30-14-92-67-92-161V32C8 30 44 25 78 0Z" fill="url(#shield)" stroke="#173c57" stroke-width="5"/><path d="m35 139 28 29 61-70" fill="none" stroke="#f0b463" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/><circle cx="78" cy="137" r="76" fill="none" stroke="#d7e8ed" stroke-width="3" opacity=".45"/><text x="78" y="342" fill="#173c57" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3" text-anchor="middle">EFFECTIVE REGULATION</text></g>
